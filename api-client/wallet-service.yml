openapi: 3.0.3
info:
  title: pagoPA Wallet API
  version: 0.0.1
  description: >-
    API to handle wallets PagoPA, where a wallet is triple between user
    identifier, payment instrument and applications (i.e pagoPA, bpd).
  termsOfService: https://pagopa.it/terms/
  contact:
    name: pagoPA - Touchpoints team
    url: https://www.pagopa.it/
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12
tags:
  - name: wallets
    description: Api's for handle a wallet
    externalDocs:
      url: >-
        https://pagopa.atlassian.net/wiki/spaces/WA/overview?homepageId=622658099
      description: Documentation
security:
  - ApiKeyAuth: [ ]
servers:
  - url: https://${hostname}
    x-internal: true
    variables:
      hostname:
        description: The hostname of the API server
        default: itnprod.pay-wallet.internal.platform.pagopa.it
        enum:
          - itndev.pay-wallet.internal.dev.platform.pagopa.it
          - itnuat.pay-wallet.internal.uat.platform.pagopa.it
          - itnprod.pay-wallet.internal.platform.pagopa.it
paths:
  /wallets/{walletId}/contract:
    delete:
      tags:
        - wallets
      summary: Deactivate contract by wallet id
      description: Deactivate the contract associated to the wallet id. An absent or already deactivated contract is treated as success.
      operationId: deactivateContractByWalletId
      parameters:
        - name: walletId
          in: path
          description: ID of wallet
          required: true
          schema:
            $ref: '#/components/schemas/WalletId'
      responses:
        '204':
          description: Contract associated to the wallet deactivated successfully, already deactivated, or absent
        '400':
          description: Invalid input id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '404':
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '409':
          description: Unable to deactivate contract. This can be caused by a forbidden status (VALIDATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '502':
          description: NPG contract deactivation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '504':
          description: Timeout serving request
components:
  schemas:
    WalletId:
      description: Wallet identifier
      type: string
      format: uuid
    ProblemJson:
      description: Body definition for error responses containing failure details
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: >-
            A short, summary of the problem type. Written in english and
            readable

            for engineers (usually not suited for non technical stakeholders and

            not localized); example: Application Unavailable
        status:
          $ref: '#/components/schemas/HttpStatusCode'
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          example: There was an error processing the request
        instance:
          type: string
          format: uri
          description: >-
            An absolute URI that identifies the specific occurrence of the
            problem.

            It may or may not yield further information if dereferenced.
    HttpStatusCode:
      type: integer
      format: int32
      description: |-
        The HTTP status code generated by the origin server for this occurrence
        of the problem.
      minimum: 100
      maximum: 600
      exclusiveMaximum: true
      example: 502
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
